<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volley Loisir Beaulieu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#eef1f8;--card:#fff;--txt:#14203d;--mut:#62708e;--bd:#d6dcec;--navy:#173889;--yel:#edc406;--ok:#1d8f4e;--ko:#c93d3d;--mt:#d97b00;--ps:#6a58c9;--ink:#173889;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--fd:"Barlow Condensed","Arial Narrow",var(--f)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1122;--card:#151e37;--txt:#eef1fa;--mut:#9aa5c4;--bd:#2a3557;--ink:#a9bdff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 var(--f)}
header{background:#173889;color:#fff;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
header img{height:48px;width:48px;object-fit:contain;border-radius:50%;background:#fff}
header h1{margin:0;font:700 1.6rem/1 var(--fd);letter-spacing:.02em}
header p{margin:3px 0 0;font-size:.88rem;opacity:.9}
header button{background:none;border:0;color:var(--yel);font:inherit;padding:0;text-decoration:underline;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h2{font:700 1.4rem/1.1 var(--fd);margin:6px 0 10px}
.card{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.off,.box.off{opacity:.55}
.date{background:#173889;color:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;line-height:1}
.date small{font-size:.78rem;opacity:.85}
.date strong{font:700 2rem/1 var(--fd);color:var(--yel);margin:2px 0}
.hrs{font:700 1.3rem/1 var(--fd)}
.cnt{margin:6px 0 10px;color:var(--mut);font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.cnt b{color:var(--txt)}
button{font:inherit;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button,.apero{padding:11px 4px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--txt);font-weight:600}
.btns .present.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btns .pas_sur.on{background:var(--yel);border-color:var(--yel);color:#14203d}
.btns .absent.on{background:var(--ko);border-color:var(--ko);color:#fff}
.btns .match.on{background:#173889;border-color:var(--yel);color:var(--yel)}
.btns .match.call{border-color:var(--yel);background:rgba(237,196,6,.18);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(237,196,6,0)}50%{box-shadow:0 0 0 6px rgba(237,196,6,.85)}}
@media(prefers-reduced-motion:reduce){.btns .match.call{animation:none;box-shadow:0 0 0 4px var(--yel)}}
.alert{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:var(--yel);color:#14203d;font-weight:600;font-size:.92rem}
.apero{width:100%;margin-top:8px;text-align:left;padding:10px 12px}
.apero.on{background:var(--yel);border-color:var(--yel);color:#14203d}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
details{margin-top:10px;color:var(--mut);font-size:.9rem}
summary{cursor:pointer;color:var(--ink)}
details p{margin:6px 0 0}
.inv{display:flex;gap:8px;margin-top:8px}.inv input{flex:1;min-width:0}
ul.mes{margin:8px 0 0;padding:0;list-style:none;font-size:.9rem}
.attente{color:var(--mt)}.accepte{color:var(--ok)}.refuse{color:var(--ko)}
.mut{color:var(--mut)}
.lnk{background:none;border:0;color:var(--ink);text-decoration:underline;padding:8px 0}
.prim{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.prim.sec{background:transparent;color:var(--ink);border:2px solid var(--bd)}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);max-width:100%}
.list button.p{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--txt)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row b{flex:1}.row small{font-weight:400}
label.ck{display:flex;align-items:center;gap:6px;margin:6px 0}
input[type=checkbox]{width:20px;height:20px}
.dates{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#14203d;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}td:last-child,th:last-child{text-align:right}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#173889;z-index:6}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:#173889;border-bottom:4px solid var(--yel)}
.tabs button{flex:1;background:none;border:0;color:#fff;opacity:.75;padding:12px 4px 10px;font:700 1.1rem/1 var(--fd);letter-spacing:.04em;text-transform:uppercase}
.tabs button.on{opacity:1;color:var(--yel);background:rgba(255,255,255,.12)}
.tabs button.new::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yel);margin-left:6px;vertical-align:super}
textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);width:100%;margin:8px 0;resize:vertical}
.actu h3{font:700 1.35rem/1.1 var(--fd);margin:4px 0 6px}
.actu p{margin:0;white-space:pre-wrap;word-break:break-word}
.actu.pin{border-left:5px solid var(--yel)}
.actu a{color:var(--ink)}
.actu .evt{font-weight:600;margin:0 0 6px}
.actu.past{opacity:.6}
.thumb{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--bd)}
#pv img{display:block;width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-top:8px}
a.go{display:inline-block;margin-top:10px;text-decoration:none;color:#fff;max-width:100%;overflow-wrap:anywhere}
.full{grid-column:1/-1}
.part h4{font:700 1.05rem/1 var(--fd);letter-spacing:.05em;text-transform:uppercase;margin:6px 0 8px;color:var(--mut)}
.pl{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pu{position:relative;display:flex;align-items:center;gap:6px;padding:3px 11px 3px 4px;border-radius:999px;border:1px solid var(--bd);font-size:.92rem}
.pu i{font-style:normal;font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;color:#fff}
.pu.ok i{background:var(--ok)}.pu.ps i{background:var(--yel);color:#14203d}.pu.ko i{background:var(--ko)}.pu.mt i{background:#173889;color:var(--yel)}
.pu.mute{opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.aperobox{margin-top:14px;border-radius:14px;overflow:hidden;border:2px solid var(--yel)}
.ban{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;color:#14203d;font:700 1.35rem/1 var(--fd);letter-spacing:.05em;text-transform:uppercase;background:repeating-linear-gradient(-45deg,#edc406 0 14px,#f7d93f 14px 28px)}
.apbody{padding:12px}.apbody p{margin:0}
.ap2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ap2 button{padding:11px 4px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--txt);font-weight:600}
.ap2 .oui{background:var(--yel);border-color:var(--yel);color:#14203d}
.apf{display:flex;gap:8px;margin-top:10px}.apf[hidden]{display:none}.apf input{flex:1;min-width:0}
.al{list-style:none;margin:0;padding:0}
.al li{display:grid;grid-template-columns:minmax(0,40%) 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.al li:last-child{border-bottom:0}
.al .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.al li span.ap{color:var(--mut);overflow-wrap:anywhere}
.al li.mine{background:rgba(237,196,6,.14);border-radius:8px;padding-left:6px;padding-right:6px}
.al li.mine input{width:100%;padding:7px 9px}
.al .x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--ko);font-weight:700;padding:0;line-height:1}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="Logo du club" onerror="this.remove()">
  <div><h1>Volley Loisir Beaulieu</h1><p id="who"></p></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-t="entr" class="on" aria-selected="true">Entraînements</button>
  <button role="tab" data-t="actus" aria-selected="false">Actus</button>
</nav>
<main id="app"><p class="mut">Chargement…</p></main>
<div id="toast" role="status"></div>
<script>
// ====== À CONFIGURER ======
const URL_API = 'https://qbrbqvaebopuqspidzyn.supabase.co';
const CLE     = 'sb_publishable_o_Ck4lJmtVKC40D5ZDSafA_hNkiV49R';   // clé "anon" ou "publishable" (jamais la clé secrète)
// ==========================

const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => { const s = new Date(d + 'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); return s[0].toUpperCase() + s.slice(1); };
const hh = t => t.replace(':','h').replace(/h00$/,'h');
const pl = (n, s, p) => `<span><b>${n}</b> ${n > 1 ? p : s}</span>`;
const bloc = d => { const x = new Date(d + 'T12:00:00'), f = o => x.toLocaleDateString('fr-FR', o);
  return `<div class="date"><small>${f({weekday:'short'})}</small><strong>${x.getDate()}</strong><small>${f({month:'short'})}</small></div>`; };
const ST = [['present','Présent'],['pas_sur','Pas sûr(e)'],['absent','Absent'],['match','Match']];
const EQ = ['Blocklieu','AceCules'];
const LIB = {attente:'en attente', accepte:'accepté', refuse:'refusé'};

let joueurs = [], moi = null, seances = [], code = null;

async function rpc(fn, args){
  const r = await fetch(`${URL_API}/rest/v1/rpc/${fn}`, {
    method:'POST', headers:{apikey:CLE,'Content-Type':'application/json'}, body:JSON.stringify(args || {})
  });
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error((j && j.message) || 'Erreur réseau');
  return j;
}
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3000); }
async function run(f){ try{ await f() }catch(e){ toast(e.message) } }

async function init(){
  try{ joueurs = await rpc('liste_joueurs'); }
  catch(e){ $('#app').innerHTML = `<div class="box">Impossible de charger les données : ${esc(e.message)}</div>`; return; }
  moi = store.get('moi');
  if(!joueurs.some(j => j.id === moi)) moi = null;
  code = store.get('code');
  moi ? charger() : choisir();
  chargerActus();
}

// ---------- Choix du prénom ----------
function choisir(){
  $('#who').textContent = '';
  $('#app').innerHTML = `<div class="box"><h2>Qui es-tu ?</h2><p class="mut">Ton choix est mémorisé sur cet appareil.</p>
    <input id="q" type="search" placeholder="Rechercher ton prénom" autocomplete="off" style="width:100%">
    <div class="list" id="liste"></div></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase();
    $('#liste').innerHTML = joueurs.filter(j => j.prenom.toLowerCase().includes(q))
      .map(j => `<button class="p" data-id="${j.id}">${esc(j.prenom)}</button>`).join('') || '<p class="mut">Aucun résultat.</p>';
  };
  $('#q').oninput = draw; draw();
  $('#liste').onclick = e => { const id = e.target.dataset.id; if(id){ moi = id; store.set('moi', id); charger(); } };
}

// ---------- Vue joueur ----------
async function maj(){ seances = await rpc('seances_liste', {p_joueur: moi, p_jours_arriere: 0}); dessiner(); }
async function charger(){
  const p = joueurs.find(j => j.id === moi);
  $('#who').innerHTML = `Salut ${esc(p.prenom)} · <button id="chg">changer</button>`;
  $('#chg').onclick = () => { store.del('moi'); moi = null; choisir(); };
  await run(maj);
}
const IC = {present:['✓','ok','présent'], pas_sur:['?','ps','pas sûr(e)'], absent:['✕','ko','absent'], match:['M','mt','match']};
const puce = p => { const [c, k, l] = IC[p.statut]; return `<li class="pu ${k} ${p.statut === 'absent' ? 'mute' : ''}"><i aria-hidden="true">${c}</i>${esc(p.prenom)}<span class="sr">, ${l}</span></li>`; };
function aperoBloc(s){
  const L = s.apero_liste;
  let corps;
  if(!s.moi_apero){
    corps = `<p>Tu restes pour l’apéro ?</p>
      <div class="ap2"><button class="oui" data-ao="${s.id}">🍻 Je reste</button><button data-an="${s.id}">Pas cette fois</button></div>
      <div class="apf" hidden><input maxlength="80" placeholder="Tu apportes quoi ? (facultatif)"><button class="prim" data-av="${s.id}">Valider</button></div>`;
  } else {
    corps = (L.length ? `<ul class="al">${L.map(x => x.id === moi
        ? `<li class="mine"><div class="nm">${esc(x.prenom)}<button class="x" data-ad="${s.id}" aria-label="Me désinscrire de l’apéro" title="Me désinscrire">✕</button></div><input data-ap="${s.id}" value="${esc(x.apporte || '')}" maxlength="80" placeholder="Ce que tu apportes" aria-label="Ce que tu apportes"></li>`
        : `<li><div class="nm">${esc(x.prenom)}</div><span class="ap">${x.apporte ? esc(x.apporte) : '<i>à définir</i>'}</span></li>`).join('')}</ul>`
      : '<p class="mut">Personne pour l’instant.</p>')
      + (s.moi_apero === 'non' ? `<p class="mut" style="margin-top:8px">Tu as répondu non. <button class="lnk" data-ar="${s.id}">Finalement, je viens</button></p>` : '');
  }
  return `<section class="aperobox"><div class="ban"><span aria-hidden="true">🍻</span>Apéro après la séance<span aria-hidden="true">🎉</span></div><div class="apbody">${corps}</div></section>`;
}
function carte(s){
  const n = s.nb || {present:0, pas_sur:0, absent:0, match:0, apero:0};
  const note = s.note ? `<p class="mut">${esc(s.note)}</p>` : '';
  const hrs = `<div class="hrs">${hh(s.debut)}–${hh(s.fin)}</div>`;
  if(s.annulee) return `<article class="card off">${bloc(s.date)}<div>${hrs}<p class="mut">Séance annulée</p>${note}</div></article>`;
  const appel = s.mon_match && s.moi !== 'match';
  const btns = ST.map(([k,l]) => `<button class="${k} ${s.moi === k ? 'on' : ''} ${k === 'match' && appel ? 'call' : ''}" data-s="${s.id}" data-k="${k}" aria-pressed="${s.moi === k}">${l}</button>`).join('');
  const mes = s.mes_invites.length ? `<ul class="mes">${s.mes_invites.map(i => `<li>${esc(i.prenom)} : <span class="${i.statut}">${LIB[i.statut]}</span></li>`).join('')}</ul>` : '';
  return `<article class="card">${bloc(s.date)}<div>${hrs}
    <div class="cnt">${pl(n.present,'présent','présents')}${pl(n.pas_sur,'pas sûr','pas sûrs')}${pl(n.absent,'absent','absents')}${pl(n.match,'match','matchs')}${s.nb_invites ? pl(s.nb_invites,'invité','invités') : ''}</div>
    ${appel ? '<p class="alert">Tu as un match ce jour-là : pense à répondre « Match ».</p>' : ''}
    <div class="btns">${btns}</div></div>
    <div class="full">
      <div class="part"><h4>Qui vient ?</h4>${s.participants.length ? `<ul class="pl">${s.participants.map(puce).join('')}</ul>` : '<p class="mut">Personne n’a encore répondu.</p>'}</div>
      <details><summary>Demander d’inviter quelqu’un</summary>
        <div class="inv"><input placeholder="Prénom de l’invité" maxlength="40"><button class="prim" data-inv="${s.id}">Envoyer</button></div></details>
      ${mes}
      ${s.apero ? aperoBloc(s) : ''}
      ${note}</div></article>`;
}
function dessiner(){
  const A = $('#app');
  A.innerHTML = (seances.length ? seances.map(carte).join('') : '<div class="box mut">Aucune séance programmée pour le moment.</div>')
    + '<button class="lnk" id="adm">Mode Nico</button>';
  $('#adm').onclick = ouvrirAdmin;
  const act = (sel, f) => A.querySelectorAll(sel).forEach(b => b.onclick = () => f(b));
  const ap = (id, choix, apporte) => run(async () => {
    await rpc('repondre_apero', {p_seance: id, p_joueur: moi, p_choix: choix, p_apporte: apporte || null}); await maj();
  });
  act('[data-k]', b => {
    const s = seances.find(x => x.id === b.dataset.s);
    run(async () => { await rpc('repondre', {p_seance: s.id, p_joueur: moi, p_statut: s.moi === b.dataset.k ? '' : b.dataset.k}); await maj(); });
  });
  act('[data-ao]', b => { const f = b.closest('.aperobox').querySelector('.apf'); f.hidden = false; f.querySelector('input').focus(); });
  act('[data-an]', b => ap(b.dataset.an, 'non'));
  act('[data-av]', b => ap(b.dataset.av, 'oui', b.previousElementSibling.value.trim()));
  act('[data-ad]', b => ap(b.dataset.ad, 'non'));
  act('[data-ar]', b => ap(b.dataset.ar, ''));
  A.querySelectorAll('[data-ap]').forEach(i => i.onchange = () => ap(i.dataset.ap, 'oui', i.value.trim()));
  act('[data-inv]', b => {
    const p = b.previousElementSibling.value.trim();
    if(!p) return toast('Entre le prénom de ton invité.');
    run(async () => { await rpc('demander_invite', {p_seance: b.dataset.inv, p_joueur: moi, p_prenom: p}); toast('Demande envoyée à Nico'); await maj(); });
  });
}

// ---------- Mode Nico ----------
async function demanderCode(){
  if(code) return true;
  const c = prompt('Code Nico :'); if(!c) return false;
  try{ await rpc('admin_verifier', {p_code: c}); code = c; store.set('code', c); return true; }
  catch(e){ toast(e.message); return false; }
}
async function ouvrirAdmin(){ if(await demanderCode()) adminListe(); }
const bar = t => `<button class="lnk" id="ret">← Retour</button><h2>${t}</h2>`;
async function adminListe(){
  let l = [];
  try{ l = await rpc('seances_liste', {p_joueur: null, p_jours_arriere: 21}); }
  catch(e){ toast(e.message); return; }
  const auj = new Date().toISOString().slice(0,10);
  $('#app').innerHTML = bar('Mode Nico') + `
    <div class="box"><b>Créer les séances</b>
      <p class="mut">Mardis 12h–14h et jeudis 20h–22h entre deux dates. Apéro, matchs et note se règlent ensuite séance par séance.</p>
      <div class="dates"><input type="date" id="du" value="${auj}"><input type="date" id="au"></div>
      <button class="prim" id="gen">Créer les séances</button></div>
    <button class="prim sec" id="st" style="margin-bottom:12px">Voir l’assiduité</button>
    ${l.map(s => `<div class="box ${s.annulee ? 'off' : ''}"><div class="row" style="border:0;padding:0"><b>${fmt(s.date)} · ${hh(s.debut)}</b><span>${s.nb ? s.nb.present : 0} présents</span></div>
      <p class="mut">${[s.annulee ? 'Annulée' : '', s.apero ? '🍻 Apéro' : '', s.equipes_match.length ? 'Match : ' + s.equipes_match.join(', ') : '',
        s.nb_attente ? `${s.nb_attente} invité${s.nb_attente > 1 ? 's' : ''} à valider` : '', `${s.nb_venus} venu${s.nb_venus > 1 ? 's' : ''} saisi${s.nb_venus > 1 ? 's' : ''}`].filter(Boolean).join(' · ')}</p>
      <button class="prim sec" data-d="${s.id}">Ouvrir</button></div>`).join('')}
    <button class="lnk" id="out">Quitter le mode Nico</button>`;
  $('#ret').onclick = charger;
  $('#out').onclick = () => { code = null; store.del('code'); charger(); };
  $('#st').onclick = adminStats;
  $('#gen').onclick = () => run(async () => {
    const du = $('#du').value, au = $('#au').value;
    if(!du || !au) throw new Error('Choisis deux dates.');
    const n = await rpc('admin_creer_seances', {p_code: code, p_du: du, p_au: au});
    toast(`${n} séance(s) créée(s)`); adminListe();
  });
  $('#app').querySelectorAll('[data-d]').forEach(b => b.onclick = () => adminDetail(l.find(s => s.id === b.dataset.d)));
}
async function adminDetail(s){
  let d;
  try{ d = await rpc('admin_detail', {p_code: code, p_seance: s.id}); }
  catch(e){ toast(e.message); return; }
  const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
  $('#app').innerHTML = bar(`${fmt(s.date)} · ${hh(s.debut)}`) + `
    <div class="box"><input id="note" placeholder="Note (facultatif)" value="${esc(s.note || '')}" style="width:100%">
      <label class="ck"><input type="checkbox" id="apero" ${s.apero ? 'checked' : ''}>Apéro après la séance</label>
      ${EQ.map(e => `<label class="ck"><input type="checkbox" data-eq="${e}" ${s.equipes_match.includes(e) ? 'checked' : ''}>Match ${e} ce jour-là</label>`).join('')}
      <div class="dates"><button class="prim" id="sav">Enregistrer</button>
      <button class="prim sec" id="ann">${s.annulee ? 'Rétablir la séance' : 'Annuler la séance'}</button></div></div>
    ${d.invites.length ? `<div class="box"><b>Invités</b>${d.invites.map(i => `<div class="row"><b>${esc(i.prenom)} <small class="mut">via ${esc(i.demandeur)}</small></b>
      <select data-i="${i.id}" aria-label="Décision pour ${esc(i.prenom)}">${opt('attente','En attente',i.statut)}${opt('accepte','Accepté',i.statut)}${opt('refuse','Refusé',i.statut)}</select></div>`).join('')}</div>` : ''}
    <div class="box"><p class="mut">Réponse du joueur, et case cochée s’il est venu.</p>
      ${d.joueurs.map(j => `<div class="row"><b>${esc(j.prenom)}${j.apero ? ' 🍻' : ''}</b>
        <select data-j="${j.id}" aria-label="Réponse de ${esc(j.prenom)}"><option value="">—</option>${ST.map(([k,l]) => opt(k, l, j.statut)).join('')}</select>
        <label class="ck" style="margin:0"><input type="checkbox" data-v="${j.id}" ${j.venu ? 'checked' : ''}>Venu</label></div>`).join('')}</div>`;
  const A = $('#app');
  const sauver = annulee => run(async () => {
    await rpc('admin_maj_seance', {p_code: code, p_seance: s.id, p_annulee: annulee, p_note: $('#note').value,
      p_apero: $('#apero').checked, p_equipes: [...A.querySelectorAll('[data-eq]')].filter(c => c.checked).map(c => c.dataset.eq)});
    adminListe();
  });
  $('#ret').onclick = adminListe;
  $('#sav').onclick = () => sauver(s.annulee);
  $('#ann').onclick = () => sauver(!s.annulee);
  A.querySelectorAll('select[data-i]').forEach(e => e.onchange = () => run(async () => {
    await rpc('admin_decider_invite', {p_code: code, p_invite: e.dataset.i, p_statut: e.value}); toast('Enregistré');
  }));
  A.querySelectorAll('select[data-j]').forEach(e => e.onchange = () => run(async () => {
    await rpc('admin_set_reponse', {p_code: code, p_seance: s.id, p_joueur: e.dataset.j, p_statut: e.value}); toast('Enregistré');
  }));
  A.querySelectorAll('input[data-v]').forEach(e => e.onchange = () => run(async () => {
    await rpc('admin_set_presence', {p_code: code, p_seance: s.id, p_joueur: e.dataset.v, p_venu: e.checked}); toast('Enregistré');
  }));
}
async function adminStats(){
  let d = [];
  try{ d = await rpc('admin_stats', {p_code: code}); }
  catch(e){ toast(e.message); return; }
  $('#app').innerHTML = bar('Assiduité') + `<div class="box"><p class="mut">Séances passées dont la présence a été saisie.</p>
    <table><tr><th>Joueur</th><th>Venu</th></tr>${d.map(j => `<tr><td>${esc(j.prenom)}</td><td>${j.venus} / ${j.total}</td></tr>`).join('')}</table></div>`;
  $('#ret').onclick = adminListe;
}

// ---------- Onglets et Actus ----------
let actus = [], imgApercu = null;
const lien = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const maxA = () => actus.length ? Math.max(...actus.map(a => +new Date(a.created_at))) : 0;
function pastille(){
  const actif = document.querySelector('.tabs .on').dataset.t === 'actus';
  document.querySelector('[data-t=actus]').classList.toggle('new', !actif && maxA() > Number(store.get('actus_vu') || 0));
}
async function chargerActus(){ try{ actus = await rpc('actus_liste'); }catch(e){} pastille(); }
function aller(t){
  document.querySelectorAll('.tabs button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  if(t === 'actus') pageActus(); else { moi ? charger() : choisir(); pastille(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => aller(b.dataset.t));

async function apercuLien(){
  imgApercu = null; $('#pv').innerHTML = '';
  const u = $('#au').value.trim();
  if(!/^https?:\/\//i.test(u)) return;
  toast('Recherche de l’aperçu…');
  try{
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(u));
    const j = await r.json();
    if(j.status !== 'success') throw new Error('indisponible');
    const d = j.data;
    if(d.title && !$('#at').value.trim()) $('#at').value = d.title.slice(0, 120);
    if(d.description && !$('#ax').value.trim()) $('#ax').value = d.description.slice(0, 500);
    imgApercu = d.image && /^https:\/\//i.test(d.image.url || '') ? d.image.url : null;
    if(imgApercu) $('#pv').innerHTML = `<img src="${esc(imgApercu)}" alt="" onerror="this.remove()">`;
    toast(imgApercu ? 'Aperçu récupéré' : 'Titre récupéré, pas d’image trouvée');
  }catch(e){ toast('Aperçu indisponible : saisis le titre à la main.'); }
}
async function pageActus(){
  imgApercu = null;
  $('#app').innerHTML = '<p class="mut">Chargement…</p>';
  await chargerActus();
  store.set('actus_vu', String(maxA())); pastille();
  const adm = !!code, A = $('#app'), aujd = new Date().toISOString().slice(0, 10);
  const dom = u => { try{ return new URL(u).hostname.replace(/^www\./, '') }catch(e){ return u } };
  A.innerHTML = (adm ? `<div class="box"><b>Publier une actu</b>
      <input id="at" placeholder="Titre (ex. Tournoi mixte de Lunel)" maxlength="120" style="width:100%;margin-top:8px">
      <input id="au" type="url" inputmode="url" placeholder="Lien https://… (facultatif)" maxlength="500" style="width:100%;margin-top:8px">
      <p class="mut" style="margin:4px 0 0;font-size:.85rem">L’aperçu (titre, image) se récupère tout seul une fois le lien collé.</p><div id="pv"></div>
      <label class="mut" for="ad" style="display:block;margin-top:8px">Date de l’événement (facultatif)</label>
      <input id="ad" type="date">
      <textarea id="ax" rows="3" maxlength="4000" placeholder="Texte (facultatif)"></textarea>
      <label class="ck"><input type="checkbox" id="ap">Épingler en haut</label>
      <button class="prim" id="pub">Publier</button></div>` : '')
    + (actus.length ? actus.map(a => `<article class="box actu ${a.epingle ? 'pin' : ''} ${a.date_evenement && a.date_evenement < aujd ? 'past' : ''}">
        ${a.image && a.url && /^https:\/\//i.test(a.image) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(a.image)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>` : ''}
        <small class="mut">${a.epingle ? '📌 ' : ''}Publié le ${new Date(a.created_at).toLocaleDateString('fr-FR', {day:'numeric', month:'long'})}</small>
        <h3>${esc(a.titre)}</h3>
        ${a.date_evenement ? `<p class="evt">📅 ${fmt(a.date_evenement)}${a.date_evenement < aujd ? ' · terminé' : ''}</p>` : ''}
        ${a.texte ? `<p>${lien(a.texte)}</p>` : ''}
        ${a.url && /^https?:\/\//i.test(a.url) ? `<a class="prim go" href="${esc(a.url)}" target="_blank" rel="noopener">Ouvrir le lien · ${esc(dom(a.url))}</a>` : ''}
        ${adm ? `<button class="lnk" data-del="${a.id}">Supprimer</button>` : ''}</article>`).join('')
      : '<div class="box mut">Pas encore d’actu.</div>')
    + (adm ? '<button class="lnk" id="quit">Quitter le mode Nico</button>' : '<button class="lnk" id="adm2">Mode Nico</button>');
  if(adm){
    $('#au').onchange = apercuLien;
    $('#pub').onclick = () => run(async () => {
      const titre = $('#at').value.trim(); if(!titre) throw new Error('Il faut un titre.');
      await rpc('admin_publier_actu', {p_code: code, p_titre: titre, p_texte: $('#ax').value, p_url: $('#au').value.trim() || null, p_date: $('#ad').value || null, p_image: imgApercu, p_epingle: $('#ap').checked});
      toast('Actu publiée'); pageActus();
    });
    A.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if(confirm('Supprimer cette actu ?')) run(async () => { await rpc('admin_supprimer_actu', {p_code: code, p_id: b.dataset.del}); pageActus(); });
    });
    $('#quit').onclick = () => { code = null; store.del('code'); pageActus(); };
  } else $('#adm2').onclick = async () => { if(await demanderCode()) pageActus(); };
}

init();
</script>
